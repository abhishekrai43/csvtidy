[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csvtidy"
version = "0.1.0"
description = "Clean and merge messy CSV files from the command line — offline, big-file capable, recipe-driven."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Rai" }]
keywords = [
    "csv",
    "data-cleaning",
    "merge",
    "dedupe",
    "deduplicate",
    "duckdb",
    "etl",
    "cli",
    "data-wrangling",
    "tidy-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=0.10.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
csvtidy = "csvtidy.cli:main"

[project.urls]
Homepage = "https://abhishekrai43.github.io/csvtidy/"
Documentation = "https://abhishekrai43.github.io/csvtidy/"
Repository = "https://github.com/abhishekrai43/csvtidy"
Issues = "https://github.com/abhishekrai43/csvtidy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/csvtidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
